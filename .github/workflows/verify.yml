name: Verify Orivex
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # A build-only public placeholder; CI artifacts are never deployed.
          VITE_PRIVY_APP_ID: ci-build-only
  intelligent-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m venv .venv-genlayer
      - run: .venv-genlayer/bin/pip install genlayer-test==0.29.2 genvm-linter==0.11.0
      - run: npm run genlayer:lint
      - run: npm run genlayer:test
